# Banco local de homologação (substitui o Supabase enquanto o projeto roda em localhost).
services:
  db:
    image: postgres:17-alpine
    container_name: nexo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: nexo_local_dev
      POSTGRES_DB: nexo
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - nexo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nexo"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  nexo-pgdata:
