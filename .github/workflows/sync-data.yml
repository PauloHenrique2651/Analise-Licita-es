name: Atualização contínua de licitações

on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "2,17,32,47 * * * *"
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recent-procurements:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: PNCP
            pages: "1"
            page_size: "50"
            concurrency: "1"
            modality_delay: "5000"
            page_delay: "1500"
          - provider: COMPRAS_GOV
            pages: "2"
            page_size: "200"
            concurrency: "2"
            modality_delay: "750"
            page_delay: "250"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: recent-procurements-${{ matrix.provider }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Atualizar alterações recentes — ${{ matrix.provider }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SYNC_LOOKBACK_DAYS: "3"
          SYNC_MAX_PAGES: ${{ matrix.pages }}
          SYNC_PAGE_SIZE: ${{ matrix.page_size }}
          SYNC_WITH_ITEMS: "false"
          SYNC_MODALITY_CONCURRENCY: ${{ matrix.concurrency }}
          SYNC_MODALITY_DELAY_MS: ${{ matrix.modality_delay }}
          SYNC_PAGE_DELAY_MS: ${{ matrix.page_delay }}
        run: npm run sync:procurements -- --provider=${{ matrix.provider }}

  recent-results:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: recent-procurement-results
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Atualizar vencedores e preços homologados
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESULT_SYNC_LOOKBACK_DAYS: "30"
          RESULT_SYNC_MAX_PAGES: "4"
          RESULT_SYNC_PAGE_SIZE: "250"
          RESULT_SYNC_HYDRATE_LIMIT: "40"
          RESULT_SYNC_PAGE_DELAY_MS: "300"
        run: npm run sync:results

  sync-watchdog:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '2,17,32,47 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: procurement-sync-watchdog
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Recuperar fontes sem atualização recente
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SYNC_WATCHDOG_STALE_MINUTES: "30"
        run: npm run sync:watchdog

  historical-backfill:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'
    strategy:
      fail-fast: false
      matrix:
        provider: [PNCP, COMPRAS_GOV]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: historical-backfill-${{ matrix.provider }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Expandir histórico — ${{ matrix.provider }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          BACKFILL_PROVIDER: ${{ matrix.provider }}
          BACKFILL_MIN_DATE: "2021-01-01"
          BACKFILL_WINDOW_DAYS: "1"
          BACKFILL_CHUNKS_PER_RUN: "6"
          BACKFILL_MAX_PAGES: "25"
          BACKFILL_WITH_ITEMS: "false"
          BACKFILL_PAGE_DELAY_MS: "1500"
        run: npm run sync:procurements:backfill

  historical-results:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: historical-procurement-results
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Expandir histórico de vencedores e preços
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RESULT_BACKFILL_MIN_DATE: "2021-01-01"
          RESULT_BACKFILL_WINDOW_DAYS: "7"
          RESULT_BACKFILL_WINDOWS_PER_RUN: "4"
          RESULT_BACKFILL_MAX_PAGES: "10"
          RESULT_BACKFILL_PAGE_SIZE: "250"
          RESULT_BACKFILL_HYDRATE_LIMIT: "100"
          RESULT_BACKFILL_PAGE_DELAY_MS: "500"
        run: npm run sync:results:backfill

  recent-items:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'
    strategy:
      fail-fast: false
      matrix:
        provider: [PNCP, COMPRAS_GOV]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Enriquecer itens recentes — ${{ matrix.provider }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SYNC_LOOKBACK_DAYS: "1"
          SYNC_MAX_PAGES: "1"
          SYNC_PAGE_SIZE: "25"
          SYNC_WITH_ITEMS: "true"
          SYNC_MODALITY_CONCURRENCY: "1"
          SYNC_MODALITY_DELAY_MS: "750"
        run: npm run sync:procurements -- --provider=${{ matrix.provider }}

  official-complements:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '17 3 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Atualizar fonte estadual de compras do RJ
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          RJ_SIGA_LOOKBACK_DAYS: "7"
          RJ_SIGA_SYNC_CONCURRENCY: "4"
        run: npm run sync:rj-siga
      - name: Enriquecer itens da fonte estadual
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npm run sync:rj-siga:items
      - name: Atualizar estados e municípios
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: npm run sync:geography
